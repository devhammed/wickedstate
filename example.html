<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wicked State Example</title>
</head>
<body>
<div *state="counter()">
    <h1 *ref="count" *text="count"></h1>
    <template *if="count > 5">
        <p *state="{ init() { console.log('in DOM') }, destroy() { console.log('removed') } }" *text="'Count is greater than 5, so it is ' + $parent?.count"></p>
    </template>
    <div *cloak *show="count < 0" style="color:red;">
        <p>So much negativity??</p>
    </div>
    <button *on[click]="increment" type="button">Increment</button>
    <button *on[click]="decrement" type="button">Decrement</button>
    <button
            type="reset"
            *state
            *ref="resetButton"
            *on[click]="$parent.reset"
            *text="$refs.resetButton.type.toUpperCase()"
    >
    </button>
    <button *on[click]="navigator.clipboard.writeText($refs.count.textContent)" type="button">
        Click to Copy
    </button>
    <ul style="list-style: none; padding-inline-start: 0;">
        <template *for="(log, index) in history : log.id">
            <li *text="`${index}. ${log.text}`"></li>
        </template>
    </ul>
    <div *test-missing *state="{ open: false }" *on[click].away="open = false">
        <button *on[click]="open = ! open" type="button">Toggle</button>
        <div *show="open">This is a dropdown</div>
    </div>
    <div *state="{}" data-message="Hello World!">
        <button type="button" *on[click]="alert($root.dataset.message)">
            Greet Me
        </button>
    </div>
    <button *state="{ label: 'Click Here' }" *text="label" *on[click]="alert('Clicked')"></button>
    <button type="button" *on[click]="$el.innerHTML = 'Hello World!'">Replace me with "Hello World!"</button>
    <div
            *state="{
        count: 0,
        interval: null,
        init() {
            this.interval = setInterval(() => {
                this.count++;
            }, 1000);
        },
        destroy() {
            clearInterval(this.interval);
        }
    }"
    >
        <header *ignore.self>
            <h1>
                Count: <span *text="count">0</span>
            </h1>

            <h2 *ignore>
                This is ignored: <span *text="count">0</span>
            </h2>
        </header>
    </div>
    <div *state="{ user: { name: 'John Doe', age: 50 } }">
        <input
                type="text"
                *ref="nameInput"
                *model="user.name"
                *on[keydown].esc.window="() => {
                alert('Clearing name');

                user.name = '';

                $el.blur();
            }"
                *on[keyup].slash.window="() => {
                alert('Focusing search');

                $el.focus();
            }"
        />
        <ul>
            <template *for="(_, key) in user">
                <li *text="`${key.toUpperCase()}: ${user[key]}`"></li>
            </template>
        </ul>
        <button *on[click]="$set('user.name', 'Jane Doe')" type="button">Update Name</button>
    </div>
    <div
            *state="{
        count: 0,
        double: 0,
        init() {
            this.$effect(() => {
                this.double = this.count * 2;
            });
        },
    }"
    >
        <h1 *text="double"></h1>
        <button type="button" *on[click]="count++">
            Double Increment
        </button>
    </div>
    <footer *text="'Copyright &copy; ' + new Date().getFullYear()">
    </footer>
</div>
<style>
    [\*cloak] {
        display: none !important;
    }
</style>
<script type="module">
    import { data, render } from './src/index.ts';

    data('counter', () => ({
        count: 0,
        nextId: 1,
        history: [],
        init() {
            this.$watch('count', (value, oldValue) => {
                console.log(`Count changed from ${oldValue} to ${value}`);
            });
        },
        increment() {
            this.history = [...this.history, { id: this.nextId, text: 'Increment: ' + this.count }];
            this.count++;
            this.nextId++;
        },
        decrement() {
            this.history = [...this.history, { id: this.nextId, text: 'Decrement: ' + this.count }];
            this.count--;
            this.nextId++;
        },
        reset() {
            this.count = 0;
            this.nextId = 1;
            this.history = [];
        },
    }));

    render(document.body).then(() => {
        console.log('We are ready to be wicked!');
    });
</script>
</body>
</html>
