<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wicked State Example</title>
</head>
<body>
<div *state="counter()">
    <h1 *text="count"></h1>
    <template *if="count > 5">
        <p *state="{ init() { console.log('in DOM') }, destroy() { console.log('removed') } }" *text="'Count is greater than 5, so it is ' + $parent?.count"></p>
    </template>
    <div *show="count < 0">
        <p *text="'So much negativity??'"></p>
    </div>
    <button *on[click]="increment" type="button">Increment</button>
    <button *on[click]="decrement" type="button">Decrement</button>
    <button
        type="reset"
        *state
        *ref="resetButton"
        *on[click]="$parent.reset"
        *text="$refs.resetButton.type.toUpperCase()"
    >
    </button>
    <ul>
        <template *for="log in history : log">
            <li *text="'History Log: ' + log"></li>
        </template>
    </ul>
</div>
<script type="module" src="./index.ts"></script>
</body>
</html>
