<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Wicked State Example</title>
</head>
<body>
<div
    *state="{
        count: 0,
        history: [],
        increment() {
            this.history = [...this.history, 'Increment: ' + this.count];
            this.count++;
        },
        decrement() {
            this.history = [...this.history, 'Decrement: ' + this.count];
            this.count--;
        },
        reset() {
            this.count = 0;
            this.history = [];
        }
    }"
>
    <h1 *text="count"></h1>
    <template *if="count > 5">
        <p *state="{ init() { console.log('in DOM') }, destroy() { console.log('removed') } }" *text="'Count is greater than 5, so it is ' + $parent?.count"></p>
    </template>
    <button *on[click]="increment" type="button">Increment</button>
    <button *on[click]="decrement" type="button">Decrement</button>
    <button type="reset" *state *on[click]="$parent.reset">
        <span >Reset</span>
    </button>
    <ul>
        <template *for="log in history">
            <li *state="{ init() { console.log('added') } }" *text="'History Log: ' + log"></li>
        </template>
    </ul>
</div>
<script type="module" src="./index.ts"></script>
</body>
</html>
